id = "hvkiefer.herdr-app-tab"
name = "Herdr App Tab"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Launch configured commands when a tab is created or renamed with a matching tab name"
platforms = ["linux", "macos"]

[[events]]
on = "tab.created"
command = ["python3", "on_tab.py"]

[[events]]
on = "tab.renamed"
command = ["python3", "on_tab.py"]
